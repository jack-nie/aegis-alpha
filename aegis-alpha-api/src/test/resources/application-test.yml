spring:
  datasource:
    url: jdbc:h2:mem:marketmind_alpha;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  redis:
    host: 127.0.0.1
    port: 0

marketmind:
  seed-enabled: false
  token-secret: test-secret
