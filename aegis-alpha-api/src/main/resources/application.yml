server:
  port: ${AEGIS_ALPHA_PORT:5178}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: ${AEGIS_ALPHA_DB_URL:jdbc:mysql://127.0.0.1:3306/aegis_alpha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AEGIS_ALPHA_DB_USER:marketmind}
    password: ${AEGIS_ALPHA_DB_PASSWORD:marketmind_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${AEGIS_ALPHA_SQL_INIT:always}
      schema-locations: classpath:db/mysql/schema.sql
      continue-on-error: true
  redis:
    host: ${AEGIS_ALPHA_REDIS_HOST:127.0.0.1}
    port: ${AEGIS_ALPHA_REDIS_PORT:6379}
    password: ${AEGIS_ALPHA_REDIS_PASSWORD:1234}
    timeout: 1200ms

mybatis:
  configuration:
    map-underscore-to-camel-case: true

aegis:
  seed-enabled: ${AEGIS_ALPHA_SEED_ENABLED:true}
  token-secret: ${AEGIS_ALPHA_TOKEN_SECRET:local-aegis-demo-secret}
  workflow:
    # When true, stale versioned layouts (research + digest keys, layoutVersion < 4) are async-written back to DB after read-path refresh.
    # Read-path version check always applies for research keys regardless of this flag.
    refresh-default-layouts: ${AEGIS_ALPHA_REFRESH_DEFAULT_LAYOUTS:false}
    # Roles allowed to approve/reject runs paused at the approval gate (待确认: seed users only have
    # portfolio_manager/research_user; add e.g. portfolio_manager here if they should approve).
    approver-roles: ${AEGIS_ALPHA_APPROVER_ROLES:desk,admin}
    # User-authored layout limits (待确认): prompt/systemPrompt max length; modelName whitelist (empty = any).
    max-prompt-chars: ${AEGIS_ALPHA_WORKFLOW_MAX_PROMPT_CHARS:8000}
    allowed-model-names: ${AEGIS_ALPHA_WORKFLOW_ALLOWED_MODEL_NAMES:}
    # 待确认: node retries allowed per run across all nodes (java-fallback node loop; the only retry layer).
    run-retry-budget: ${AEGIS_ALPHA_WORKFLOW_RUN_RETRY_BUDGET:4}
    # Bounded workflow executor (streaming runs, async starts).
    executor:
      core-size: ${AEGIS_ALPHA_WORKFLOW_EXECUTOR_CORE:4}
      max-size: ${AEGIS_ALPHA_WORKFLOW_EXECUTOR_MAX:16}
      queue-capacity: ${AEGIS_ALPHA_WORKFLOW_EXECUTOR_QUEUE:200}
    stream:
      # 待确认: when the browser disconnects, false = keep consuming the orchestrator stream so the run
      # finishes and is recorded (CLIENT_DISCONNECTED event); true = stop reading and cancel the run.
      cancel-on-disconnect: ${AEGIS_ALPHA_WORKFLOW_STREAM_CANCEL_ON_DISCONNECT:false}
  models:
    # P4-6 (待确认): model names a client may request (chat body.modelName, agent modelName).
    # Keep in sync with aegis-alpha-orchestrator app/core/models.yaml.
    allowed-names: ${AEGIS_ALPHA_ALLOWED_MODEL_NAMES:deepseek-v4-flash,deepseek-v4-pro}
  agent:
    # P3-16 (待确认): default model for agents / inline workflow agents without an explicit modelName.
    # Defaults to the orchestrator gateway model so one env var changes both.
    default-model: ${AEGIS_AGENT_DEFAULT_MODEL:${AEGIS_ALPHA_LANGCHAIN_MODEL:deepseek-v4-flash}}
  langchain:
    enabled: ${AEGIS_ALPHA_LANGCHAIN_ENABLED:true}
    engine-url: ${AEGIS_ALPHA_LANGCHAIN_ENGINE_URL:http://127.0.0.1:8787}
    provider: ${AEGIS_ALPHA_LANGCHAIN_PROVIDER:openai}
    model: ${AEGIS_ALPHA_LANGCHAIN_MODEL:deepseek-v4-flash}
    api-key: ${AEGIS_ALPHA_LANGCHAIN_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${AEGIS_ALPHA_LANGCHAIN_BASE_URL:${OPENAI_BASE_URL:}}
    connect-timeout-ms: ${AEGIS_ALPHA_LANGCHAIN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AEGIS_ALPHA_LANGCHAIN_READ_TIMEOUT_MS:120000}
    # P4-4 (待确认): read timeout of the synchronous whole-run calls (/execute-workflow, /resume-workflow);
    # keep it at the orchestrator AEGIS_ALPHA_WORKFLOW_TIMEOUT_SECONDS (900s) + 30s.
    workflow-read-timeout-ms: ${AEGIS_ALPHA_LANGCHAIN_WORKFLOW_READ_TIMEOUT_MS:930000}
  router:
    # Intent routing: LLM results below llm-min-confidence never short-circuit keyword rules;
    # research-priority-confidence is the minimum to dispatch a workflow from chat.
    llm-min-confidence: ${AEGIS_ALPHA_ROUTER_LLM_MIN_CONFIDENCE:0.6}
    research-priority-confidence: ${AEGIS_ALPHA_ROUTER_RESEARCH_PRIORITY_CONFIDENCE:0.6}
    # Java classify read timeout must exceed the orchestrator AEGIS_ALPHA_ROUTER_TIMEOUT_MS (2500ms).
    classify-connect-timeout-ms: ${AEGIS_ALPHA_ROUTER_CLASSIFY_CONNECT_TIMEOUT_MS:1000}
    classify-read-timeout-ms: ${AEGIS_ALPHA_ROUTER_CLASSIFY_READ_TIMEOUT_MS:4000}
    cache-ttl-ms: ${AEGIS_ALPHA_ROUTER_CACHE_TTL_MS:600000}
    cache-max-entries: ${AEGIS_ALPHA_ROUTER_CACHE_MAX_ENTRIES:500}
    breaker-failure-threshold: ${AEGIS_ALPHA_ROUTER_BREAKER_FAILURES:3}
    breaker-open-ms: ${AEGIS_ALPHA_ROUTER_BREAKER_OPEN_MS:30000}
  help:
    # Local HelpLoopService is the single retrieval implementation. When true, the orchestrator
    # /help/execute may re-draft the answer from the Java-selected chunks (falls back to local).
    remote-generation-enabled: ${AEGIS_ALPHA_HELP_REMOTE_GENERATION_ENABLED:false}
  dify:
    enabled: ${AEGIS_ALPHA_DIFY_ENABLED:false}
    base-url: ${AEGIS_ALPHA_DIFY_BASE_URL:https://api.dify.ai/v1}
    workflow-api-key: ${AEGIS_ALPHA_DIFY_WORKFLOW_API_KEY:}
    chat-api-key: ${AEGIS_ALPHA_DIFY_CHAT_API_KEY:}
    console-base-url: ${AEGIS_ALPHA_DIFY_CONSOLE_BASE_URL:}
    console-token: ${AEGIS_ALPHA_DIFY_CONSOLE_TOKEN:}
    node-callback-base-url: ${AEGIS_ALPHA_NODE_CALLBACK_BASE_URL:http://127.0.0.1:5178}
    node-execution-token: ${AEGIS_ALPHA_NODE_EXECUTION_TOKEN:}  # no default: set the shared service token explicitly
  market-data:
    yahoo-chart-url: ${AEGIS_ALPHA_YAHOO_CHART_URL:https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1m&range=1d}
    stooq-quote-url: ${AEGIS_ALPHA_STOOQ_QUOTE_URL:https://stooq.com/q/l/?s={symbol}.us&f=sd2t2ohlcv&h&e=csv}
    sec-ticker-map-url: ${AEGIS_ALPHA_SEC_TICKER_MAP_URL:https://www.sec.gov/files/company_tickers.json}
    sec-companyfacts-url: ${AEGIS_ALPHA_SEC_COMPANYFACTS_URL:https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json}
    yahoo-news-rss-url: ${AEGIS_ALPHA_YAHOO_NEWS_RSS_URL:https://feeds.finance.yahoo.com/rss/2.0/headline?s={symbol}&region=US&lang=en-US}
    gdelt-news-url: ${AEGIS_ALPHA_GDELT_NEWS_URL:https://api.gdeltproject.org/api/v2/doc/doc?query={symbol}&mode=artlist&format=json&maxrecords=10}
    # Values below 8000 are raised to 8000 (MarketDataService.MIN_HTTP_TIMEOUT_MS).
    http-timeout-ms: ${AEGIS_ALPHA_MARKET_DATA_HTTP_TIMEOUT_MS:8000}
