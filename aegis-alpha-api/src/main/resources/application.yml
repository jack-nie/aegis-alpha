server:
  port: ${AEGIS_ALPHA_PORT:5178}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: ${AEGIS_ALPHA_DB_URL:jdbc:mysql://127.0.0.1:3306/aegis_alpha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AEGIS_ALPHA_DB_USER:aegis}
    password: ${AEGIS_ALPHA_DB_PASSWORD:aegis_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${AEGIS_ALPHA_SQL_INIT:always}
      schema-locations: classpath:db/mysql/schema.sql
      continue-on-error: true
  redis:
    host: ${AEGIS_ALPHA_REDIS_HOST:127.0.0.1}
    port: ${AEGIS_ALPHA_REDIS_PORT:6379}
    password: ${AEGIS_ALPHA_REDIS_PASSWORD:1234}
    timeout: 1200ms

mybatis:
  configuration:
    map-underscore-to-camel-case: true

aegis:
  seed-enabled: ${AEGIS_ALPHA_SEED_ENABLED:true}
  token-secret: ${AEGIS_ALPHA_TOKEN_SECRET:local-aegis-demo-secret}
  langchain:
    enabled: ${AEGIS_ALPHA_LANGCHAIN_ENABLED:false}
    engine-url: ${AEGIS_ALPHA_LANGCHAIN_ENGINE_URL:http://127.0.0.1:8787}
    provider: ${AEGIS_ALPHA_LANGCHAIN_PROVIDER:openai}
    model: ${AEGIS_ALPHA_LANGCHAIN_MODEL:deepseek-v4-flash}
    api-key: ${AEGIS_ALPHA_LANGCHAIN_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${AEGIS_ALPHA_LANGCHAIN_BASE_URL:${OPENAI_BASE_URL:}}
  dify:
    enabled: ${AEGIS_ALPHA_DIFY_ENABLED:false}
    base-url: ${AEGIS_ALPHA_DIFY_BASE_URL:https://api.dify.ai/v1}
    workflow-api-key: ${AEGIS_ALPHA_DIFY_WORKFLOW_API_KEY:}
    chat-api-key: ${AEGIS_ALPHA_DIFY_CHAT_API_KEY:}
    console-base-url: ${AEGIS_ALPHA_DIFY_CONSOLE_BASE_URL:}
    console-token: ${AEGIS_ALPHA_DIFY_CONSOLE_TOKEN:}
    node-callback-base-url: ${AEGIS_ALPHA_NODE_CALLBACK_BASE_URL:http://127.0.0.1:5178}
    node-execution-token: ${AEGIS_ALPHA_NODE_EXECUTION_TOKEN:local-workflow-node-token}
  market-data:
    yahoo-chart-url: ${AEGIS_ALPHA_YAHOO_CHART_URL:https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1m&range=1d}
    stooq-quote-url: ${AEGIS_ALPHA_STOOQ_QUOTE_URL:https://stooq.com/q/l/?s={symbol}.us&f=sd2t2ohlcv&h&e=csv}
    sec-ticker-map-url: ${AEGIS_ALPHA_SEC_TICKER_MAP_URL:https://www.sec.gov/files/company_tickers.json}
    sec-companyfacts-url: ${AEGIS_ALPHA_SEC_COMPANYFACTS_URL:https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json}
    yahoo-news-rss-url: ${AEGIS_ALPHA_YAHOO_NEWS_RSS_URL:https://feeds.finance.yahoo.com/rss/2.0/headline?s={symbol}&region=US&lang=en-US}
    gdelt-news-url: ${AEGIS_ALPHA_GDELT_NEWS_URL:https://api.gdeltproject.org/api/v2/doc/doc?query={symbol}&mode=artlist&format=json&maxrecords=10}
    http-timeout-ms: ${AEGIS_ALPHA_MARKET_DATA_HTTP_TIMEOUT_MS:4000}
