# P4-6 model registry (orchestrator side). Operators edit this file or point
# AEGIS_ALPHA_MODELS_FILE at their own copy.
#
# 待确认 (to confirm with the owner):
#   - the model list: only the models already referenced by the code base are listed;
#   - pricing: every price is intentionally null (unknown). Cost is reported only when all
#     prices needed for a call are configured (USD per 1M tokens); otherwise costUsd is null;
#   - contextWindow / maxOutputTokens: null = unknown (context budgets keep their own defaults);
#   - allowUnlisted: false = a requested model that is not listed falls back to the default model
#     (warning + trace), true = unlisted names pass through unchanged.
allowUnlisted: false

# When the configured endpoint (AEGIS_ALPHA_LANGCHAIN_BASE_URL) contains the key, only models whose
# `endpoint` is that key may run there; others fall back (warning + trace) and an unfit default is
# replaced by this model (replaces the old silent DeepSeek rewrite). Custom / proxy URLs that match
# no key accept every listed model.
endpointDefaults:
  deepseek: deepseek-v4-flash

models:
  deepseek-v4-flash:
    provider: openai-compatible
    endpoint: deepseek
    supportsTools: true
    contextWindow: null
    maxOutputTokens: null
    pricing:
      inputPerMTok: null
      outputPerMTok: null
      cacheReadPerMTok: null
  deepseek-v4-pro:
    provider: openai-compatible
    endpoint: deepseek
    supportsTools: true
    contextWindow: null
    maxOutputTokens: null
    pricing:
      inputPerMTok: null
      outputPerMTok: null
      cacheReadPerMTok: null
