name: Aegis Alpha CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-test:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-alpha-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test

  frontend-build:
    name: Frontend build and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-alpha-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aegis-alpha-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend contract tests
        run: npm run test:portfolio-list
      - name: Build frontend
        run: npm run build

  orchestrator-test:
    name: Orchestrator lint and smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-alpha-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run unit tests
        env:
          AEGIS_ALPHA_LANGCHAIN_MOCK: "true"
          AEGIS_ALPHA_LANGCHAIN_API_KEY: test-key
          AEGIS_ALPHA_NODE_EXECUTION_TOKEN: local-workflow-node-token
        # Full suite includes contract/smoke auth tests (test_service_auth, test_contract_intent_response)
        run: python -m pytest tests -q --tb=short
      - name: Check syntax
        run: python -m py_compile app/main.py
      - name: Start orchestrator
        shell: bash
        env:
          AEGIS_ALPHA_LANGCHAIN_MOCK: "true"
          AEGIS_ALPHA_NODE_EXECUTION_TOKEN: local-workflow-node-token
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8787 > orchestrator-ci.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "Orchestrator is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Orchestrator failed to start:"
          cat orchestrator-ci.log
          exit 1
      - name: Smoke test
        shell: bash
        env:
          AEGIS_ALPHA_NODE_EXECUTION_TOKEN: local-workflow-node-token
          AEGIS_ALPHA_LANGCHAIN_MOCK: "true"
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8787/health
          echo ""
          # Protected route without token must be unauthorized (Phase 0.5 auth smoke)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8787/classify-intent \
            -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "401" ]; then
            echo "Expected 401 without token for /classify-intent, got $code"
            exit 1
          fi
          # With service token, must not be 401
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8787/classify-intent \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer local-workflow-node-token" \
            -d '{}')
          if [ "$code" = "401" ]; then
            echo "Unexpected 401 with valid service token for /classify-intent"
            exit 1
          fi
          # Mock E2E: mini workflow execute with service token + delegatedToken field accepted
          code=$(curl -s -o /tmp/e2e-wf.json -w "%{http_code}" -X POST http://127.0.0.1:8787/execute-workflow \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer local-workflow-node-token" \
            -d '{
              "subject": "AAPL",
              "state": {"ticker": "AAPL"},
              "delegatedToken": "smoke-delegation",
              "nodes": [
                {"id": "start", "data": {"handler": "start", "label": "Start", "nodeType": "start"}},
                {"id": "risk", "data": {"handler": "finance.risk_assessment", "label": "Risk"}},
                {"id": "end", "data": {"handler": "end", "label": "End", "nodeType": "end"}}
              ],
              "edges": [
                {"source": "start", "target": "risk"},
                {"source": "risk", "target": "end"}
              ]
            }')
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "execute-workflow unauthorized: $code"
            cat /tmp/e2e-wf.json || true
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "execute-workflow unexpected status: $code"
            cat /tmp/e2e-wf.json || true
            exit 1
          fi
          echo "Smoke test passed (health + service auth + mock execute-workflow)"

  deploy:
    name: Deploy to production
    needs: [backend-test, frontend-build, orchestrator-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/aegis-alpha
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.aegis-alpha.yml build --no-cache
            docker compose -f docker-compose.aegis-alpha.yml up -d
            echo "Deploy complete"
