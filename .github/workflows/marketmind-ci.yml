name: Aegis Alpha CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-test:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-alpha-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test

  frontend-build:
    name: Frontend build and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-alpha-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aegis-alpha-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend contract tests
        run: npm run test:portfolio-list
      - name: Build frontend
        run: npm run build

  orchestrator-test:
    name: Orchestrator lint and smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-alpha-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile app/main.py
      - name: Start orchestrator
        shell: bash
        run: |
          MARKETMIND_LANGCHAIN_MOCK=true python -m uvicorn app.main:app --host 0.0.0.0 --port 8787 > orchestrator-ci.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "Orchestrator is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Orchestrator failed to start:"
          cat orchestrator-ci.log
          exit 1
      - name: Smoke test
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:8787/health
          echo ""
          echo "Smoke test passed"

  deploy:
    name: Deploy to production
    needs: [backend-test, frontend-build, orchestrator-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /opt/aegis-alpha
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.aegis-alpha.yml build --no-cache
            docker compose -f docker-compose.aegis-alpha.yml up -d
            echo "Deploy complete"
