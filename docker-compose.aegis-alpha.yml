services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aegis_alpha}
      MYSQL_USER: ${MYSQL_USER:-aegis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - aegis-alpha-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", 'redis-server --requirepass "$${AEGIS_ALPHA_REDIS_PASSWORD}"']
    environment:
      AEGIS_ALPHA_REDIS_PASSWORD: ${AEGIS_ALPHA_REDIS_PASSWORD:?Set AEGIS_ALPHA_REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${AEGIS_ALPHA_REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  langgraph:
    build:
      context: ./aegis-alpha-orchestrator
    restart: unless-stopped
    environment:
      AEGIS_ALPHA_LANGGRAPH_PORT: ${AEGIS_ALPHA_LANGGRAPH_PORT:-8787}
      AEGIS_ALPHA_LANGGRAPH_HOST: ${AEGIS_ALPHA_LANGGRAPH_HOST:-0.0.0.0}
      AEGIS_ALPHA_LANGCHAIN_PROVIDER: ${AEGIS_ALPHA_LANGCHAIN_PROVIDER:-openai}
      AEGIS_ALPHA_LANGCHAIN_MODEL: ${AEGIS_ALPHA_LANGCHAIN_MODEL:-gpt-4o-mini}
      AEGIS_ALPHA_LANGCHAIN_BASE_URL: ${AEGIS_ALPHA_LANGCHAIN_BASE_URL:-}
      AEGIS_ALPHA_LANGCHAIN_API_KEY: ${AEGIS_ALPHA_LANGCHAIN_API_KEY:-}
      AEGIS_ALPHA_LANGCHAIN_TIMEOUT_MS: ${AEGIS_ALPHA_LANGCHAIN_TIMEOUT_MS:-25000}
      AEGIS_ALPHA_LANGCHAIN_MOCK: ${AEGIS_ALPHA_LANGCHAIN_MOCK:-true}
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./aegis-alpha-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      langgraph:
        condition: service_healthy
    environment:
      AEGIS_ALPHA_PORT: ${AEGIS_ALPHA_PORT:-5178}
      AEGIS_ALPHA_DB_URL: ${AEGIS_ALPHA_DB_URL:-jdbc:mysql://mysql:3306/aegis_alpha?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      AEGIS_ALPHA_DB_USER: ${AEGIS_ALPHA_DB_USER:-aegis}
      AEGIS_ALPHA_DB_PASSWORD: ${AEGIS_ALPHA_DB_PASSWORD:?Set AEGIS_ALPHA_DB_PASSWORD in .env}
      AEGIS_ALPHA_SQL_INIT: ${AEGIS_ALPHA_SQL_INIT:-always}
      AEGIS_ALPHA_REDIS_HOST: ${AEGIS_ALPHA_REDIS_HOST:-redis}
      AEGIS_ALPHA_REDIS_PORT: ${AEGIS_ALPHA_REDIS_PORT:-6379}
      AEGIS_ALPHA_REDIS_PASSWORD: ${AEGIS_ALPHA_REDIS_PASSWORD:?Set AEGIS_ALPHA_REDIS_PASSWORD in .env}
      AEGIS_ALPHA_SEED_ENABLED: ${AEGIS_ALPHA_SEED_ENABLED:-true}
      AEGIS_ALPHA_TOKEN_SECRET: ${AEGIS_ALPHA_TOKEN_SECRET:?Set AEGIS_ALPHA_TOKEN_SECRET in .env}
      AEGIS_ALPHA_LANGCHAIN_ENABLED: ${AEGIS_ALPHA_LANGCHAIN_ENABLED:-true}
      AEGIS_ALPHA_LANGCHAIN_ENGINE_URL: ${AEGIS_ALPHA_LANGCHAIN_ENGINE_URL:-http://langgraph:8787}
      AEGIS_ALPHA_LANGCHAIN_PROVIDER: ${AEGIS_ALPHA_LANGCHAIN_PROVIDER:-openai}
      AEGIS_ALPHA_LANGCHAIN_MODEL: ${AEGIS_ALPHA_LANGCHAIN_MODEL:-gpt-4o-mini}
      AEGIS_ALPHA_LANGCHAIN_API_KEY: ${AEGIS_ALPHA_LANGCHAIN_API_KEY:-}
      AEGIS_ALPHA_LANGCHAIN_BASE_URL: ${AEGIS_ALPHA_LANGCHAIN_BASE_URL:-}
      AEGIS_ALPHA_LANGCHAIN_TIMEOUT_MS: ${AEGIS_ALPHA_LANGCHAIN_TIMEOUT_MS:-25000}
    ports:
      - "5178:5178"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5178/_backend/auth/me >/dev/null || test $$? -eq 22"]
      interval: 10s
      timeout: 5s
      retries: 18

  frontend:
    build:
      context: ./aegis-alpha-web
      args:
        AEGIS_ALPHA_BACKEND_INTERNAL_URL: ${AEGIS_ALPHA_BACKEND_INTERNAL_URL:-http://backend:5178}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${AEGIS_ALPHA_FRONTEND_PORT:-5174}
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  aegis-alpha-mysql:
